# sparql-mcp server configuration

[core]
store    = "./store"
ontology = "./ontology"
docs     = "./front/docs"

[project]
active = "default"

[gdrive]
enabled   = false
folder_id = "<your-google-drive-folder-id>"

[plugins]
# Activate third-party plugins here. Plugin code lives under crates/ or
# as an external dependency implementing the ToolPlugin trait.

[viewer]
# Live 3D graph viewer side-channel (crates/sparql-mcp-viewer). Off by
# default — enabling it costs one extra loopback TCP listener, nothing else.
enabled = false
bind    = "127.0.0.1:7878"

[ingest]
# Write safety limits and guards. Every key is optional; the values below are
# the defaults, except `file_roots`, which is unset by default.
#
# write_wait_timeout_secs   = 30         # wait for the write gate before `write_busy`
# max_update_bytes          = 1048576    # largest update_sparql request
# max_batch_bytes           = 1048576    # largest inline RDF payload (load_ontology)
# max_load_file_bytes       = 67108864   # largest file for load_ontology_file
#
# DROP / CLEAR / MOVE / COPY onto a graph, `DELETE { ?s ?p ?o }` and
# INSERT over a variable graph are refused unless this is true. Writes to the
# internal graphs, LOAD, and DROP ALL / CLEAR ALL stay refused either way.
# allow_destructive_updates = false
#
# Confine load_ontology_file and export_graph to these directories. Use TOML
# literal (single-quoted) strings so Windows backslashes are kept. A root that
# does not exist stops the server at startup.
# file_roots = ['C:\data\rdf', 'D:/dumps']
#
# Ingestion jobs (ingest_begin / ingest_batch / ingest_commit). Defaults shown.
# max_open_jobs            = 4          # unfinished jobs at once
# max_job_batches          = 10000
# max_batch_triples        = 10000      # triples in one ingest_batch
# max_job_triples_staged   = 100000     # a staged commit is one in-memory transaction (~7 s, ~320 MiB)
# max_job_triples_direct   = 10000000
# max_replace_triples      = 200000     # target size + staged size a replace may rewrite
# max_iri_bytes            = 4096
# max_literal_bytes        = 65536
# event_max_triples        = 5000       # triples per viewer event
# event_changed_threshold  = 50000      # above this, one `changed` event instead
# sweep_interval_secs      = 300        # how often idle jobs expire and old ones are purged
# file_batch_triples       = 5000       # triples per batch when ingest_file streams a file
