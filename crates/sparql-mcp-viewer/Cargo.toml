[package]
name = "sparql-mcp-viewer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "sparql-mcp-viewer"
path = "src/main.rs"

[dependencies]
sparql-mcp = { path = "../sparql-mcp-core" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Not a straight reuse of the core crate's tokio feature list: single-
# threaded `rt` (not `rt-multi-thread`), `time` for the reconnect backoff,
# `sync` for the inbox channel; no `process`, which the viewer never spawns.
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "macros", "sync"] }
crossbeam-channel = "0.5"
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = "0.3"
rand = { version = "0.9", features = ["small_rng"] }

# "3d" pulls in default_platform (bevy_winit + x11/wayland + multi_threaded),
# 3D rendering/PBR, picking and scene — matching the Technical Plan's
# feature list without hand-picking each sub-crate.
bevy = { version = "=0.20.1", default-features = false, features = [
    "3d",
    "bevy_camera_controller",
    "pan_orbit_camera",
    # `bevy_ui` alone is only the API; `ui_bevy_render` also draws it.
    "ui_bevy_render",
    "ui_picking",
] }
arboard = "3"

[dev-dependencies]
tempfile = "3"
rmcp = { version = "1.5", default-features = false, features = ["macros"] }
